name: Déploiement O2switch

# Chaque push sur main : build de l'export statique Next.js (dossier out/), puis envoi sur O2switch par rsync via SSH.
# Lancement manuel possible (onglet Actions > Run workflow), avec un mode « simulation » qui ne modifie rien sur le serveur.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simulation : liste ce qui serait envoyé ou supprimé, sans rien modifier"
        type: boolean
        default: true

concurrency:
  group: deploy-o2switch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build (export statique)
        run: npm run build

      - name: Contrôle de l'export
        run: |
          test -f out/index.html
          test -f out/.htaccess
          test -f out/sitemap.xml
          echo "$(find out -type f | wc -l) fichiers dans out/"

      - name: Secrets de déploiement présents ?
        id: cfg
        env:
          HOST: ${{ secrets.O2_HOST }}
          KEY: ${{ secrets.O2_SSH_KEY }}
        run: |
          if [ -n "$HOST" ] && [ -n "$KEY" ]; then echo "ok=true" >> $GITHUB_OUTPUT; else echo "::warning::Secrets O2_* absents : build seulement, pas d'envoi."; fi

      - name: Clé SSH et empreinte du serveur
        if: steps.cfg.outputs.ok == 'true'
        env:
          SSH_KEY: ${{ secrets.O2_SSH_KEY }}
          SSH_HOST: ${{ secrets.O2_HOST }}
          SSH_PORT: ${{ secrets.O2_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Envoi sur O2switch (rsync)
        if: steps.cfg.outputs.ok == 'true'
        env:
          SSH_HOST: ${{ secrets.O2_HOST }}
          SSH_USER: ${{ secrets.O2_USER }}
          SSH_PORT: ${{ secrets.O2_PORT }}
          REMOTE_PATH: ${{ secrets.O2_PATH }}
          # Un push déploie pour de vrai ; un lancement manuel suit la case « simulation ».
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          case "$REMOTE_PATH" in
            /home/*/*) ;;
            *) echo "O2_PATH doit être un chemin absolu du type /home/compte/public_html"; exit 1 ;;
          esac
          OPTS="-rltvz --delete --omit-dir-times --exclude=/.well-known/ --exclude=/cgi-bin/ --exclude=/.htpasswd --exclude=/entities/"
          if [ "$DRY_RUN" = "true" ]; then OPTS="$OPTS --dry-run"; echo "MODE SIMULATION"; fi
          rsync $OPTS \
            -e "ssh -i ~/.ssh/deploy_key -p ${SSH_PORT:-22}" \
            out/ "$SSH_USER@$SSH_HOST:${REMOTE_PATH%/}/"
