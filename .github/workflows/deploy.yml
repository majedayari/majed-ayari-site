name: Déploiement O2switch (FTPS)

# Chaque push sur main : build de l'export statique Next.js (dossier out/), puis envoi sur O2switch en FTPS.
# L'action tient un fichier d'état sur le serveur (.ftp-deploy-sync-state.json) : elle n'envoie que les fichiers modifiés
# et ne supprime que ceux qu'elle a elle-même envoyés. Les fichiers propres au serveur (entities/, cgi-bin/...) ne sont jamais touchés.
# Lancement manuel possible (onglet Actions > Run workflow), avec un mode « simulation » qui ne modifie rien.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simulation : liste ce qui serait envoyé ou supprimé, sans rien modifier"
        type: boolean
        default: true

concurrency:
  group: deploy-o2switch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build (export statique)
        run: npm run build

      - name: Contrôle de l'export
        run: |
          test -f out/index.html
          test -f out/.htaccess
          test -f out/sitemap.xml
          echo "$(find out -type f | wc -l) fichiers dans out/"

      - name: Secrets de déploiement présents ?
        id: cfg
        env:
          HOST: ${{ secrets.FTP_HOST }}
          USER: ${{ secrets.FTP_USER }}
          PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -n "$HOST" ] && [ -n "$USER" ] && [ -n "$PASS" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Secrets FTP_HOST, FTP_USER et FTP_PASSWORD absents : build seulement, pas d'envoi."
          fi

      - name: Envoi sur O2switch (FTPS)
        if: steps.cfg.outputs.ok == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./out/
          # Le compte FTP est limité à /majed-ayari.com : la racine du compte est le dossier du site.
          server-dir: ./
          # Un push déploie pour de vrai ; un lancement manuel suit la case « simulation ».
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          log-level: standard
